<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <H1><U>FORM</U></H1>
<FORM ACTION="RADIO.HTML">
    <P><BIG>*ENTER YOUR NAME</BIG></P>
   <INPUT TYPE="TEXT" PLACEHOLDER ="ENTER NAME">
    <P><BIG>*PASSWORD</BIG></P> 
    <INPUT TYPE="TEXT" PLACEHOLDER="PASSWORD">
        <BR>
    <H2><B><U>SELECT THE CLASS</U></B></H2>
    <label for="101">
        <input type="radio" value="class x" name="class" id="101">CLASS 10
        <BR>
    </label>
    <label for="102">
        <input type="radio" value="class x" name="class" id="102">CLASS 11
    </label>
    <DIV ID="ID1" CLASS="GROUP1">
    </DIV>
    <DIV ID="ID2" CLASS="GROUP1">
    </DIV>
    <BR>
    <H2><B><U>STATE YOUR LIKING</U></B></H2>
    <LABEL FOR="ID1">
        <INPUT TYPE="CHECKBOX" VALUE="TEA" NAME="LIKING" ID="ID1"><BIG>TEA</BIG>
    </LABEL>
    <BR>
    <LABEL FOR="ID2">
        <INPUT TYPE="CHECKBOX" VALUE="COFEE" NAME="LIKING" ID="ID2"><BIG>COFEE</BIG>
    </LABEL>
    <BR>
        <H3><BIG><U>SELECT THE STATE</U></BIG></H3>
        <SELECT NAME="STATE" ID="STATE">
            <OPTION VALUE="DELHI">DELHI</OPTION>
            <OPTION VALUE="JHARKHAND">JHARKHAND</OPTION>
            <OPTION VALUE="MUMBAI">MUMBAI</OPTION>
            <OPTION VALUE="UTTER PRADESH">U.P</OPTION>
        </SELECT>
        <BR>
            <H3><BIG><U>SELECT THE CITY</U></BIG></H3>
        <SELECT NAME="CITY" ID="CITY">
            <OPTION VALUE="RANCHI">RANCHI</OPTION>
            <OPTION VALUE="BOKARO">BOKARO</OPTION>
        </SELECT>
    <BR>
        <H3><BIG><U>FEEDBACK</U></BIG></H3>
    <TEXTAREA NAME="FEEDBACK" ID="101" PLACEHOLDER="PLEASE GIVE YOUR VALUEABLE FEEDBACK HERE" ROWS="5" HEIGHT="5" WIDTH="59">   YOUR FEEDBACK </TEXTAREA>
    <BR>
    
    <VIDEO  SCR="aditya.mp4" WIDTH="320" HEIGHT="240" CONTROLS>
             <SOURCE SRC="aditya.mp4" TYPE="video/mp4">   
</body>
